name: Windows Store CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Package Windows App (MSIX)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Flutter Windows App
        run: flutter build windows --release

      - name: Create MSIX Package
        run: flutter pub run msix:create

      - name: Upload MSIX Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-Studio-MSIX
          path: build/windows/x64/runner/Release/*.msix

      - name: Release to GitHub (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/x64/runner/Release/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Microsoft Store (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: microsoft/store-submission-action@v1
        with:
          tenant-id: ${{ secrets.MS_TENANT_ID }}
          client-id: ${{ secrets.MS_CLIENT_ID }}
          client-secret: ${{ secrets.MS_CLIENT_SECRET }}
          app-id: ${{ secrets.MS_STORE_APP_ID }}
          package-path: build/windows/x64/runner/Release/*.msix
