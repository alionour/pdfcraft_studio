name: Windows Store CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Package Windows App (MSIX)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy dependencies for Flutter 3.40+
        shell: pwsh
        run: |
          Get-ChildItem -Path "$env:PUB_CACHE", "$env:LOCALAPPDATA\Pub\Cache", "C:\Users\runneradmin\AppData\Local\Pub\Cache" -Include "*.cmake.in", "*.cmake", "CMakeLists.txt" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'cmake_minimum_required\s*\(\s*VERSION\s+[0-2]\.') {
              $updated = $content -replace 'cmake_minimum_required\s*\(\s*VERSION\s+[0-2]\.[0-9\.]*', 'cmake_minimum_required(VERSION 3.5'
              Set-Content -Path $_.FullName -Value $updated
              Write-Host "Patched CMake version in: $($_.FullName)"
            }
          }
          Get-ChildItem -Path "$env:PUB_CACHE", "$env:LOCALAPPDATA\Pub\Cache", "C:\Users\runneradmin\AppData\Local\Pub\Cache" -Filter "phosphor_icon_data.dart" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'class PhosphorIconData extends IconData') {
              $updated = $content.Replace('class PhosphorIconData extends IconData', '// @dart=2.19`nclass PhosphorIconData extends IconData').Replace('extends IconData', 'implements IconData')
              Set-Content -Path $_.FullName -Value $updated
              Write-Host "Patched PhosphorIconData in: $($_.FullName)"
            }
          }

      - name: Run Flutter Tests
        run: flutter test

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2.2.0
        with:
          cmake-version: '3.28.3'

      - name: Build Flutter Windows App
        run: flutter build windows --release

      - name: Create MSIX Package
        run: flutter pub run msix:create

      - name: Upload MSIX Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-Studio-MSIX
          path: build/windows/x64/runner/Release/*.msix

      - name: Release to GitHub (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/x64/runner/Release/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSStore CLI
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          tenantId: ${{ secrets.MS_TENANT_ID }}
          clientId: ${{ secrets.MS_CLIENT_ID }}
          clientSecret: ${{ secrets.MS_CLIENT_SECRET }}

      - name: Publish to Microsoft Store
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          msstore publish --app-id ${{ secrets.MS_STORE_APP_ID }}
